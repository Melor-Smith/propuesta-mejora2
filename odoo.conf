; Odoo 18.0 para una empresa peruana (ABC), ejecutado desde su código fuente (fuente/).
; Las rutas son relativas a la carpeta ODOO-ABC: arranque con iniciar_odoo.bat.
; Localización Perú (país, PEN, IGV, RUC, es_PE): configurar_peru.bat.
[options]
; Código: núcleo y addons del repositorio oficial (rama 18.0) y, al final, addons/ con los
; módulos propios (p. ej. los del Parcial 4). Los de addons/ pueden reemplazar a los oficiales.
addons_path = fuente/odoo/addons,fuente/addons,addons

; Base de datos: PostgreSQL local con un usuario propio, sin privilegios de superusuario.
; Odoo se niega a usar "postgres". La contraseña no se guarda aquí: hoy PostgreSQL usa
; autenticación "trust" solo para conexiones desde este equipo (127.0.0.1).
db_host = 127.0.0.1
db_port = 5432
db_user = odoo18
db_password = False

; Solo trabaja con la base "abc": no ve ni toca las bases del Odoo 19 instalado con binarios.
; list_db = False también apaga el gestor de bases web (/web/database/manager), así que no
; hace falta guardar aquí una contraseña maestra (admin_passwd).
db_name = abc
dbfilter = ^abc$
list_db = False

; Plantilla de la base: template1 (UTF8, Spanish_Peru.1252). Con la plantilla por defecto
; (template0) Odoo crea la base con LC_COLLATE 'C' y LC_CTYPE del servidor, y PostgreSQL en
; Windows rechaza la conexion: "collate y ctype diferentes no estan soportados en esta plataforma".
db_template = template1

; Servidor web: puerto 8070 (el 8069 lo usa el Odoo 19 de binarios), solo en este equipo.
http_interface = 127.0.0.1
http_port = 8070

; Datos de Odoo (adjuntos y sesiones) dentro del proyecto; la carpeta está en .gitignore.
data_dir = datos

; Base limpia, sin datos de demostración.
without_demo = all

; wkhtmltopdf 0.12.6 "with patched qt" (PDF de facturas), instalado aparte, sin depender
; del Odoo 19: winget install wkhtmltopdf.wkhtmltox
bin_path = C:\Program Files\wkhtmltopdf\bin
