; Odoo 18.0 para ABC (empresa peruana) dentro del contenedor "odoo" (docker-compose.yml).
; Las contraseñas NO están aquí: entrypoint.sh las agrega desde docker/.env al arrancar.
[options]
; Núcleo y addons del repositorio oficial + módulos propios (carpeta addons/ montada).
addons_path = /opt/odoo/odoo/addons,/opt/odoo/addons,/mnt/extra-addons

; Base de datos: el servicio "db" de docker-compose (PostgreSQL 18, UTF8).
db_host = db
db_port = 5432
db_user = odoo

; Solo la base "abc"; el gestor de bases web queda apagado.
db_name = abc
dbfilter = ^abc$
list_db = False

; Dentro del contenedor escucha en todas las interfaces; afuera se publica solo en 127.0.0.1.
http_interface = 0.0.0.0
http_port = 8069

data_dir = /var/lib/odoo
without_demo = all
